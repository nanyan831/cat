ktor {
    application {
        modules = [ com.example.catlifepet.server.ApplicationKt.module ]
    }
    deployment {
        host = "0.0.0.0"
        host = ${?HOST}
        port = 8080
        port = ${?PORT}
    }
}

catlifepet {
    environment = "development"
    environment = ${?CATLIFEPET_ENV}
    publicBaseUrl = ${?CATLIFEPET_PUBLIC_BASE_URL}
    databaseUrl = ${?DATABASE_URL}
    databaseUser = ${?DATABASE_USER}
    databasePassword = ${?DATABASE_PASSWORD}
    jwtSecret = ${?CATLIFEPET_JWT_SECRET}
    tokenPepper = ${?CATLIFEPET_TOKEN_PEPPER}
    jwtIssuer = "catlifepet-server"
    jwtIssuer = ${?CATLIFEPET_JWT_ISSUER}
    jwtAudience = "catlifepet-android"
    jwtAudience = ${?CATLIFEPET_JWT_AUDIENCE}
    developmentMailboxDir = "server/build/dev-mailbox"
    developmentMailboxDir = ${?CATLIFEPET_DEV_MAILBOX_DIR}
    smtpHost = ${?SMTP_HOST}
    smtpPort = ${?SMTP_PORT}
    smtpUsername = ${?SMTP_USERNAME}
    smtpPassword = ${?SMTP_PASSWORD}
    smtpFrom = ${?SMTP_FROM}
    smtpStartTls = ${?SMTP_STARTTLS}
    openAiApiKey = ${?OPENAI_API_KEY}
}
